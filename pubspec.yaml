name: gallerydrift
description: Infinite canvas for the user's explicitly selected local photo albums.
publish_to: none
version: 0.3.4+8
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  drift_core:
    git:
      url: https://github.com/riccardopinato/ArtDrift-Infinite-Art-Gallery.git
      ref: 56af2a4b9f6f44a00b3197eda4bc217b5adfea39
      path: packages/drift_core
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  google_mlkit_image_labeling: ^0.15.0
  video_player: ^2.10.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
