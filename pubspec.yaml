name: gallerydrift
description: Infinite canvas for the user's explicitly selected local photo albums.
publish_to: none
version: 0.3.3+7
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  drift_core:
    git:
      url: https://github.com/riccardopinato/ArtDrift-Infinite-Art-Gallery.git
      ref: 1f7d19f91502405fe3d7d8e5538977d6117cd2ee
      path: packages/drift_core
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  google_mlkit_image_labeling: ^0.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
