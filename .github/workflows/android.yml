name: Gallery Drift Android — core consumer build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Configure Flutter Gradle composite plugin repositories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['FLUTTER_ROOT'])
          path = root / 'packages/flutter_tools/gradle/settings.gradle.kts'
          text = path.read_text(encoding='utf-8')
          if 'pluginManagement {' not in text:
              header = (
                  'pluginManagement {\n'
                  '    repositories {\n'
                  '        google()\n'
                  '        mavenCentral()\n'
                  '        gradlePluginPortal()\n'
                  '    }\n'
                  '}\n\n'
              )
              path.write_text(header + text, encoding='utf-8')
          print('FLUTTER_COMPOSITE_PLUGIN_REPOS_OK')
          PY
      - name: Signing preflight unit smoke — good password and wrong password
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          keytool -genkeypair -storetype PKCS12 -keystore "$scratch/release.jks" \
            -alias test-release -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=GalleryDrift Signing Preflight Test" \
            -storepass local-test-pass-123456 >/dev/null 2>&1
          export ANDROID_SIGNING_KEYSTORE_PATH="$scratch/release.jks"
          export ANDROID_KEYSTORE_PASSWORD=local-test-pass-123456
          export ANDROID_KEY_PASSWORD=local-test-pass-123456
          export ANDROID_KEY_ALIAS=test-release
          export ANDROID_CERT_SHA256="$(keytool -list -v -keystore "$scratch/release.jks" \
            -alias test-release -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -nE 's/.*SHA256: ([[:xdigit:]:]+)/\1/p' | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$ANDROID_CERT_SHA256"
          java scripts/VerifySigning.java
          export ANDROID_KEY_PASSWORD=incorrect-key-password
          if java scripts/VerifySigning.java > "$scratch/negative.log" 2>&1; then
            echo "::error::Wrong PKCS12 key password was incorrectly accepted"
            exit 1
          fi
          grep -q "KEY_PASSWORD_INVALID" "$scratch/negative.log"
          echo "SIGNING_PASSWORD_NEGATIVE_TEST_PASS"
      - name: Regression tests for ARM64 size and ABI policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_arm64_packaging.py'
      - name: Test release-signature report parser
        run: python3 -m unittest discover -s scripts/tests -p 'test_verify_release_apk.py'
      - name: Validate source-pinned Core sync contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_sync_drift_core.py'
      - name: Create Android shell
        run: flutter create --project-name gallerydrift --org com.riccardopinato --platforms=android .
      - name: Remove demo test
        run: rm -f test/widget_test.dart
      - name: Patch photo permissions
        run: python3 scripts/patch_android.py
      - name: Render product launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check "CairoSVG==2.7.1"
          python3 scripts/install_brand_icon.py
      - name: Dependencies (pinned Drift Core Git SHA)
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Android ARM64 internal APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify ARM64-only ABI and APK size
        run: python3 scripts/verify_arm64_apk.py --apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --max-mib 36
      - name: End-to-end APK PEM signer SHA-256 verification (debug identity)
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          test -s "$HOME/.android/debug.keystore"
          mkdir -p build
          keytool -exportcert -rfc -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android > build/internal-debug-certificate.pem
          EXPECTED="$(python3 -c 'import hashlib,ssl,pathlib; print(hashlib.sha256(ssl.PEM_cert_to_DER_cert(pathlib.Path("build/internal-debug-certificate.pem").read_text())).hexdigest())')"
          SDK_BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          python3 scripts/verify_release_apk.py --apk "$APK" --apksigner "$SDK_BUILD_TOOLS/apksigner" --expected "$EXPECTED" --report build/internal-apk-signer-report.txt
          echo "INTERNAL_APK_SIGNER_PEM_VERIFIED"
      - uses: actions/upload-artifact@v4
        with:
          name: GalleryDrift-ARM64-internal-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
