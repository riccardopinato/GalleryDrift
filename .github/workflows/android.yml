name: Gallery Drift Android — core consumer build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Create Android shell
        run: flutter create --project-name gallerydrift --org com.riccardopinato --platforms=android .
      - name: Remove demo test
        run: rm -f test/widget_test.dart
      - name: Patch photo permissions
        run: python3 scripts/patch_android.py
      - name: Render product launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check "CairoSVG==2.7.1"
          python3 scripts/install_brand_icon.py
      - name: Dependencies (pinned Drift Core Git SHA)
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Android ARM64 internal APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: GalleryDrift-ARM64-internal-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
