name: Gallery Drift — stable signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Require complete stable signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing signing input: $key"; exit 1; fi
          done
      - name: Prepare Android shell
        run: |
          flutter create --project-name gallerydrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py
          python3 -m pip install --disable-pip-version-check "CairoSVG==2.7.1"
          python3 scripts/install_brand_icon.py
      - name: Restore private keystore temporarily
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/app.jks
          test -s .signing/app.jks
      - name: Configure release-only stable signing
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/.signing/app.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure_release_signing.py
      - name: Preflight — verify PKCS12 private key and SHA-256
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/.signing/app.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: java scripts/VerifySigning.java
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build stable release APK ARM64
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/.signing/app.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify expected signing certificate and record SHA-256
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK" > build/apk-signer-report.txt
          actual="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' build/apk-signer-report.txt | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::Signing fingerprint mismatch"; exit 1
          fi
          sha256sum "$APK" > build/release-sha256.txt
          echo "SIGNING_IDENTITY_VERIFIED"
      - uses: actions/upload-artifact@v4
        with:
          name: gallerydrift-stable-signed-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/release-sha256.txt
          if-no-files-found: error
      - name: Remove local keystore
        if: always()
        shell: bash
        run: rm -rf .signing
